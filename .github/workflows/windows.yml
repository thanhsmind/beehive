name: Windows

on:
  schedule:
    # 16:00 UTC = 23:00 Asia/Ho_Chi_Minh
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R6 CUTOVER. This workflow used to run a hand-curated SUBSET of the .mjs
# verify chain on windows-latest — the suites that had been read end to end
# for path-separator and spawnSync assumptions — with a four-file
# BEE_VERIFY_EXCLUDE of known-red ones. That whole apparatus existed because
# the Node suites were the product's tests and only some of them were
# Windows-honest.
#
# The Rust suite has no such split: it is ONE suite, it is the same
# `commands.verify` a local session runs, and win32 is bee's primary platform
# (the port fixed the two filed win32 defects outright). So this lane now runs
# the entire suite, unexcluded. A Windows-only failure is a real failure here,
# not a suite to add to a skip list.

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/bee-rs

      # `bee test` and several worktree suites shell out through POSIX sh;
      # Git Bash ships with the runner. NOTE (found during the port): a bare
      # `bash` spawn on Windows resolves through System32 first and launches
      # WSL bash, not Git Bash — the runner passes an explicit PATH to the
      # child for exactly this reason.
      - name: Verify chain (full suite, no exclusions)
        run: cargo test --release --manifest-path packages/bee-rs/Cargo.toml -- --test-threads=1

  install-ps1-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # PS 5.1-compatible syntax check via the legacy tokenizer API, run
      # under Windows PowerShell (not pwsh/PowerShell Core) since that is
      # what `shell: powershell` selects on windows-latest and matches the
      # PS 5.1 target install.ps1 is written for.
      - name: PowerShell 5.1 syntax check (install.ps1)
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw scripts/install.ps1), [ref]$errs) | Out-Null
          if ($errs.Count) {
            $errs
            exit 1
          }
