name: Windows

on:
  # win32 is bee's primary platform and the only one where the shell
  # resolution, path separators and process spawning differ — so this lane
  # runs on every push and PR too, not only nightly. The suite is seconds.
  push:
  pull_request:
  schedule:
    # 16:00 UTC = 23:00 Asia/Ho_Chi_Minh
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R6 CUTOVER. This workflow used to run a hand-curated SUBSET of the .mjs
# verify chain on windows-latest — the suites that had been read end to end
# for path-separator and spawnSync assumptions — with a four-file
# BEE_VERIFY_EXCLUDE of known-red ones. That whole apparatus existed because
# the Node suites were the product's tests and only some of them were
# Windows-honest.
#
# The Rust suite has no such split: it is ONE suite, it is the same
# `commands.verify` a local session runs, and win32 is bee's primary platform
# (the port fixed the two filed win32 defects outright). So this lane now runs
# the entire suite, unexcluded. A Windows-only failure is a real failure here,
# not a suite to add to a skip list.

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/bee-rs

      # `bee test` and several worktree suites shell out through POSIX sh;
      # Git Bash ships with the runner. A bare `bash` spawn on Windows
      # resolves to `%SystemRoot%\System32\bash.exe` — the WSL launcher —
      # whether the search goes through CreateProcess (System32 first) or
      # through PATH (System32 is also first there). src/shell.rs now pins a
      # real Win32 bash at the head of the CHILD's PATH and drops every
      # %SystemRoot% candidate; `shell::the_resolved_shell_is_not_wsl` is the
      # regression pin, and it runs in this lane.
      #
      # Same command as ci.yml, and the same string as .bee/config.json
      # `commands.verify`: no `--test-threads=1`, so the suite CI proves is
      # the suite `bee cells finish` runs.
      # Same reason as ci.yml: the OpenCode belt's gates derive their ground
      # truth from the installed runtime, and refuse to report green without
      # it. Install it rather than set the skip escape hatch, and pin it —
      # the plugin API ships every day or two with no stability guarantee.
      - name: Install the OpenCode runtime (pinned) for the belt gates
        run: npm i -g opencode-ai@1.18.16

      - name: Verify chain (full suite, no exclusions)
        run: cargo test --release --no-fail-fast --manifest-path packages/bee-rs/Cargo.toml

  install-ps1-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # PS 5.1-compatible syntax check via the legacy tokenizer API, run
      # under Windows PowerShell (not pwsh/PowerShell Core) since that is
      # what `shell: powershell` selects on windows-latest and matches the
      # PS 5.1 target install.ps1 is written for.
      - name: PowerShell 5.1 syntax check (install.ps1)
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw scripts/install.ps1), [ref]$errs) | Out-Null
          if ($errs.Count) {
            $errs
            exit 1
          }
