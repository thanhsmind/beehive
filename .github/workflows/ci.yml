name: CI

on:
  # The verify chain runs on every push and every PR, not only nightly.
  #
  # It used to be schedule-only, which put the session preamble's "check CI
  # instead of running anything locally" instruction on a signal that could be
  # 24 hours stale — while the suite it stands in for finishes in seconds. A
  # gate whose freshest evidence predates the change it is gating is not a
  # gate.
  push:
  pull_request:
  schedule:
    # 23:00 UTC = 06:00 Asia/Ho_Chi_Minh (next day)
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R6 CUTOVER. This workflow used to install Node on a [18, 20, 22] matrix and
# run three .mjs entry points (verify_all, impact_registry --check,
# ci_verify_issue). All three are gone with the Node runtime. What replaced
# them:
#   * the verify chain           -> `cargo test --release`, which IS
#                                   .bee/config.json `commands.verify`
#   * impact-registry freshness  -> RETIRED with the tool. Its subject was the
#                                   .mjs suite graph, and the cargo suite that
#                                   replaced it runs whole in ~20s, so there is
#                                   no impacted-only mode to keep fresh.
#   * the verify-red issue filer -> `gh issue` (the runner ships gh)
# The Node matrix is deleted rather than replaced by a Rust one: bee ships a
# single binary built from one toolchain, so "does it work on three runtimes"
# is no longer a question this repo has.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # issues: write is scoped to this job only, so a red chain can file or
    # comment on a verify-red issue; contents: read must be listed explicitly
    # too — specifying any permission here resets every unlisted scope to
    # `none`, and actions/checkout below still needs it.
    permissions:
      contents: read
      issues: write
    steps:
      # fetch-depth: 0 — the OKF pin checks verify that each content-addressed
      # pin resolves through git (`git show <blob>:<path>`), not only through
      # its committed-copy fallback. A default shallow (depth-1) checkout
      # cannot reach the old pinned blobs, so those git-resolution assertions
      # fail on CI while passing locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/bee-rs

      - name: Build the binary
        run: cargo build --release --manifest-path packages/bee-rs/Cargo.toml

      # The OpenCode belt's parity and registry gates derive their ground truth
      # from the installed runtime itself — its real tool registry, its real
      # plugin host. Without it here, those tests refuse to report green rather
      # than certify coverage they never obtained, which is the whole point of
      # the gate (a skip that reads as a pass is how a belt goes missing). So
      # CI installs the runtime instead of setting the skip escape hatch.
      # Pinned: the plugin API carries no stability guarantee and ships every
      # day or two, so an unpinned install would make an upstream release able
      # to turn this suite red with no change of ours.
      - name: Install the OpenCode runtime (pinned) for the belt gates
        run: npm i -g opencode-ai@1.18.16

      # This is .bee/config.json `commands.verify` verbatim — the single
      # source of truth for the verify chain, so CI can never drift from what
      # a local session runs. Output is teed so a red run has a tail to attach
      # to the auto-filed issue below.
      #
      # The trailing `-- --test-threads=1` is GONE. It was drift: the declared
      # command has no such flag, so CI was running a serial suite while every
      # `bee cells finish` ran a parallel one — and the parallel one was the
      # red/flaky one. Its real cause (three `posix_shell()` copies resolving
      # to the WSL launcher, so every shell-spawning test paid a VM cold
      # start) is fixed in src/shell.rs; the suite is green and ~8x faster
      # parallel. Pinning threads here would only hide the next such defect
      # from CI while local sessions kept hitting it.
      # `set -o pipefail` is load-bearing, not decoration: without it the step
      # exits with tee's status, so a RED suite reported success. Run
      # 30894209268 logged three failures on the 2.1.8 release commit and this
      # job passed — the reds had been invisible to CI for as long as the pipe
      # had been there. Windows CI, which does not pipe, was the only honest
      # report.
      - name: Run verify chain
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --no-fail-fast --manifest-path packages/bee-rs/Cargo.toml 2>&1 | tee verify-output.log

      # Freshness only matters on the green path — the default step condition
      # already skips these after the verify step above fails.
      - name: Check hook manifests are in sync with the catalog
        run: ./packages/bee-rs/target/release/bee dev render-hook-manifests --check

      # Only for UNATTENDED runs. On a push or a PR the red is already in
      # front of the person who caused it; filing an issue there would turn
      # every work-in-progress push into tracker noise and train everyone to
      # ignore the label.
      - name: File verify-red issue on failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="verify chain red on ${{ github.ref_name }}"
          tail="$(tail -n 60 verify-output.log 2>/dev/null || echo '(no output captured)')"
          body="$(printf 'Run: %s/%s/actions/runs/%s\n\n```\n%s\n```\n' \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" "$tail")"
          existing="$(gh issue list --state open --search "$title in:title" --json number \
            --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label verify-red || \
              gh issue create --title "$title" --body "$body"
          fi
