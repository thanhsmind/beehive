[package]
name = "bee"
version.workspace = true
edition.workspace = true
description = "bee harness CLI — Rust port (strangler front door; unported verbs delegate to node bee.mjs)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
