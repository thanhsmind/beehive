interface:
  display_name: "Bee Wayfinding"
  short_description: "Chart a fog-state idea into a map of decision tickets before shaping. Use when the user has an itch or idea with no nameable outcome yet, when explicit invocation asks to explore or brainstorm, when `bee orient` resumes an open map with frontier tickets, or when a `bee route` Qualify verdict parks something for vagueness. Not for locking product decisions in one sitting (that's bee-shaping) or for building product work."
policy:
  allow_implicit_invocation: true
