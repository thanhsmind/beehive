[package]
name = "bee-core"
version.workspace = true
edition.workspace = true

[lib]
name = "bee_core"
path = "src/lib.rs"

[dependencies]
getrandom = "0.4.3"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
