[package]
name = "queen-bee"
version.workspace = true
edition.workspace = true

[lib]
name = "queen_bee"
path = "src/lib.rs"

[[bin]]
name = "queen-bee"
path = "src/main.rs"

[dependencies]
bee-core = { path = "../bee-core" }
# Insertion-order JSON — see the load-bearing note in bee-core/Cargo.toml.
# Declared here too (not just relied on via feature unification) so this
# crate's own `json!`/`Map` construction in `status.rs` keeps mjs key order
# no matter which subset of the workspace a build resolves.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.11.0"
