[workspace]
resolver = "2"
members = [
    "queen-bee",
    "bee-core",
    "queen-bench",
    "bee-parity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
lto = "fat"
codegen-units = 1
# rust-port-18 (FIX-FIRST, P1, validation decision 2026-07-26): was
# `panic = "abort"`. The hook fail-open contract (D7b) is implemented with
# `std::panic::catch_unwind` (crates/queen-bee/src/hooks/write_guard.rs:
# `run_fail_open`, used by both write-guard and model-guard) — an internal
# panic must be caught, logged to `.bee/logs/hooks.jsonl`, and the hook
# must still exit 0. `catch_unwind` cannot catch anything once the panic
# runtime is `abort`: the process aborts (SIGABRT) instead, so a real
# release binary would have killed the very turn the guard exists to
# protect. `panic = "unwind"` (the default, spelled out here for
# discoverability) is required for the shipped binary to honor the
# contract it advertises. Proven red (abort observed) then green (exit 0 +
# crash line) by crates/queen-bee/tests/release_failopen.rs, which spawns
# the actual `target/release/queen-bee` binary rather than a test-profile
# harness. Cost tradeoff measured at fix time: unwind tables add a small
# amount to binary size / cold-start versus abort; see
# docs/history/rust-port/reports/rust-port-18.md for the measurement —
# accepted as the price of an honest fail-open guarantee.
panic = "unwind"
strip = true
