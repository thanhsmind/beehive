interface:
  display_name: "Bee Herding"
  short_description: "Drive the bee-herding cockpit's roles — bootstrap, dispatch, merge, route, broker, and supervisor. Use when a human invokes bootstrap directly (no --role given), or when bee herding control-loop runs one iteration as --role dispatch|merge|route|broker|supervisor. Not for feature work inside a worktree — that belongs to the working agent's own bee chain."
policy:
  allow_implicit_invocation: true
